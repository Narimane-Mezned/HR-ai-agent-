<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HR AI Agent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
  </head>
  <body>
    <div id="login-screen"></div>

    <div id="app-screen" class="container">
      <div id="sidebar">
        <h1 class="brand">HR AI Agent</h1>
        <nav id="tabs"></nav>
        <div class="sidebar-footer">
          <div id="sidebar-username" class="sidebar-username"></div>
          <button id="logout-btn" class="secondary full">Log out</button>
        </div>
      </div>

      <div id="main-panel">
        <div class="view" id="view-dashboard"></div>
        <div class="view" id="view-screening"></div>
        <div class="view" id="view-matching" style="display: none"></div>
        <div class="view" id="view-scheduling" style="display: none"></div>
        <div class="view" id="view-onboarding" style="display: none"></div>
      </div>

      <div id="schedule-modal" class="modal-overlay" style="display: none">
        <div class="modal">
          <h3 id="sched-title">Schedule interview</h3>
          <div id="sched-slots"></div>
          <label>Or enter a custom time</label>
          <input id="sched-custom" type="datetime-local" />
          <div class="modal-actions">
            <button type="button" class="secondary" id="sched-cancel">
              Cancel
            </button>
            <button type="button" class="primary" id="sched-confirm">
              Confirm
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
